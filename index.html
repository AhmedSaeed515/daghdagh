// Online rooms: each player on their own phone. The room owner's phone runs the game
// and relays messages through a public ntfy topic (plain HTTPS, works inside the hosted viewer).
function initOnline(X){
const {esc,shuffle,norm,Q,CATS,shell,sfx,app,avh,avOK}=X;
const SERVERS=['ntfy.envs.net','ntfy.adminforge.de','ntfy.sh'];
const ALPH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const rid=n=>Array.from({length:n},()=>ALPH[Math.floor(Math.random()*ALPH.length)]).join('');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ME={id:rid(8),name:'',av:'',g:''};
const LIM={q:20,wr:45,vt:30,rv:7};
let NET=null,S=null,H=null,room=null,off=0,uiTimer=null,hostTimer=null,mine={},msg='',lobbyCfg={mode:'classic',cats:(JSON.parse(localStorage.getItem('lo3ba_cats')||'[]')||[]).filter(k=>CATS[k]),diff:0,n:10,maxP:8,appr:false};
let joinTries=0,joinT=null,lastSt=0;

// ---------- transport ----------
function openNet(srv,topic,onmsg){
  const base='https://'+srv+'/'+topic;
  let stop=false,last='all',ctrl=null,fails=0,poll=false;const seen=new Set();
  function line(l){if(!l.trim())return;let j;try{j=JSON.parse(l)}catch(e){return}if(j.id)last=j.id;if(j.event!=='message'||seen.has(j.id))return;seen.add(j.id);let m;try{m=JSON.parse(j.message)}catch(e){return}try{onmsg(m)}catch(e){console.error(e)}}
  async function loop(){
    while(!stop){
      const t0=Date.now();
      try{
        if(poll){const r=await fetch(base+'/json?poll=1&since='+last);const tx=await r.text();tx.split('\n').forEach(line);await sleep(1800);continue;}
        ctrl=new AbortController();
        const r=await fetch(base+'/json?since='+last,{signal:ctrl.signal});
        if(!r.ok||!r.body)throw new Error('no stream');
        const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
        while(!stop){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf('\n'))>=0){line(buf.slice(0,i));buf=buf.slice(i+1);}}
      }catch(e){}
      if(stop)return;
      fails=(Date.now()-t0<3000)?fails+1:0;
      if(fails>=4)poll=true;
      await sleep(fails?1200:150);
    }
  }
  loop();
  return {
    async send(m){for(let a=0;a<4;a++){try{const r=await fetch(base,{method:'POST',body:JSON.stringify(m)});if(r.ok)return true;if(r.status===429)await sleep(2000);}catch(e){}await sleep(600);}return false;},
    close(){stop=true;try{ctrl&&ctrl.abort()}catch(e){}}
  };
}
async function probe(srv){try{const c=new AbortController();const t=setTimeout(()=>c.abort(),4500);const r=await fetch('https://'+srv+'/lgz-probe-'+rid(6),{method:'POST',body:'{"t":"ping"}',signal:c.signal});clearTimeout(t);return r.ok;}catch(e){return false}}
function connect(code){const i=+code[0]-1;const srv=SERVERS[i];return openNet(srv,'lgz-'+code,onNet);}

// ---------- entry ----------
function open(){leave(true);msg='';lobbyView();}
function leave(quiet){
  if(NET){NET.close();NET=null}
  clearInterval(uiTimer);clearInterval(hostTimer);clearTimeout(joinT);uiTimer=hostTimer=joinT=null;
  S=null;H=null;room=null;mine={};
}
function lobbyView(){
  X.setTab&&X.setTab('online');
  shell(`<div class="panel center"><div class="big-emoji">🌐</div><h2>لعب أونلاين</h2><p>كل واحد بموبايله. واحد يعمل غرفة ويدّي الكود لصحابه، وهما يدخلوا بنفس الكود.</p>
  <div class="pcard">${avh(X.store.get('myav',''),'avl')}<b>${esc(X.store.get('myname',''))}</b><button class="btn sm ghost" data-act="me">تعديل</button></div>
  <div id="omsg" class="warn">${esc(msg)}</div>
  <button class="btn big" data-o="create">🎮 اعمل غرفة جديدة</button>
  <h3>أو ادخل غرفة صاحبك</h3><input id="ocode" maxlength="5" placeholder="كود الغرفة" style="text-align:center;letter-spacing:6px;text-transform:uppercase">
  <button class="btn ghost" data-o="join">ادخل الغرفة</button></div>`,{title:'أونلاين',nav:true});
}
function readName(){ME.name=String(X.store.get('myname','')).trim().slice(0,14);ME.av=avOK(X.store.get('myav',''));ME.g=X.store.get('mygender','');return ME.name;}
function warn(t){msg=t;const e=document.getElementById('omsg');if(e)e.textContent=t;}

async function create(){
  if(!readName())return warn('اكتب اسمك الأول');
  warn('بجهّز الغرفة...');
  let idx=-1;for(let i=0;i<SERVERS.length;i++){if(await probe(SERVERS[i])){idx=i;break}}
  if(idx<0)return warn('معرفتش أوصل لخدمة الاتصال دلوقتي. جرّب تاني بعد شوية.');
  const code=(idx+1)+rid(4);
  room={code,host:true};
  H={players:[{id:ME.id,name:ME.name,av:ME.av,score:0,right:0}],pending:[],cfg:{...lobbyCfg,cats:lobbyCfg.cats.slice()},r:0,ph:'lobby',seq:0,items:[],ans:{},fakes:{},votes:{},opts:[],owners:[],right:-1,ends:0};
  NET=connect(code);
  hostTimer=setInterval(hostTick,300);
  hostBroadcast();
}
function join(){
  if(!readName())return warn('اكتب اسمك الأول');
  const code=((document.getElementById('ocode')||{}).value||'').trim().toUpperCase();
  if(!/^[1-3][A-Z2-9]{4}$/.test(code))return warn('الكود لازم يكون 5 حروف وأرقام زي 1K7QZ');
  room={code,host:false};NET=connect(code);joinTries=0;lastSt=0;
  shell(`<div class="panel center"><div class="big-emoji">⏳</div><h2>بدخّلك الغرفة ${esc(code)}...</h2><p>لو اتأخر، يمكن صاحب الغرفة بيراجع طلبات الانضمام، أو اتأكد من الكود وإنه فاتح اللعبة.</p><button class="btn ghost" data-o="leave">رجوع</button></div>`);
  sendJoin();
}
function sendJoin(){
  if(!room||room.host||S)return;
  if(joinTries++>=15){leave();msg='الغرفة مردتش. اتأكد من الكود وإن صاحبها لسه فاتح اللعبة.';return lobbyView();}
  NET.send({t:'join',id:ME.id,name:ME.name,av:ME.av});
  joinT=setTimeout(sendJoin,4000);
}

// ---------- incoming ----------
function onNet(m){
  if(!m||!m.t)return;
  if(room.host){
    if(m.t==='join')return hostJoin(m);
    if(m.t==='ans')return hostAns(m.id,m.r,m.k);
    if(m.t==='fk')return hostFake(m.id,m.r,m.x);
    if(m.t==='vt')return hostVote(m.id,m.r,m.k);
    if(m.t==='bye')return hostBye(m.id);
    return;
  }
  if(m.t==='st'){if(S&&m.seq<=S.seq)return;applyState(m.s,m.now,m.seq);}
  if(m.t==='rj'&&m.to===ME.id&&S&&m.r===S.r){mine.rej=true;if(S.ph==='wr'){mine.fk=null;view();}}
  if(m.t==='kick'&&m.to===ME.id){leave();msg=m.why||'خرجت من الغرفة';lobbyView();}
}
function applyState(s,now,seq){
  const prev=S;S=s;S.seq=seq;off=now-Date.now();lastSt=Date.now();clearTimeout(joinT);
  if(!prev||prev.r!==s.r)mine={};else if(prev.ph!==s.ph)mine={fk:mine.fk};
  if(!s.pl.some(p=>p.i===ME.id)){ // not accepted (game already started?)
    if(s.ph!=='lobby'){leave();msg='اللعبة بدأت بالفعل في الغرفة دي.';return lobbyView();}
  }
  if(prev&&s.ph==='rv'&&prev.ph!=='rv'){setTimeout(()=>sfx.round(),900);const k=s.pl.findIndex(p=>p.i===ME.id);if(s.pt&&s.pt[k]>0)sfx.ok();else sfx.bad();}
  view();startUi();
}

// ---------- host engine ----------
function pubState(extra){
  const h=H;
  const s={code:room.code,ph:h.ph,r:h.r,n:h.cfg.n,mode:h.cfg.mode,cats:h.cfg.cats,diff:h.cfg.diff,pl:h.players.map(p=>({i:p.id,n:p.name,s:p.score,a:p.av||''})),ends:h.ends,lim:h.lim||0};
  if(h.ph==='q'||h.ph==='rv'||h.ph==='wr'||h.ph==='vt'){const it=h.items[h.r];s.q={c:it.cat,d:it.diff,t:it.text};}
  if(h.ph==='q'||h.ph==='vt'||h.ph==='rv')s.o=h.opts;
  if(h.ph==='rv'){s.right=h.right;s.pk=h.picks;s.pt=h.pts;s.rs=h.rscore;if(h.mode==='bluff'||h.cfg.mode==='bluff')s.by=h.owners.map(a=>a.map(pid=>h.players.findIndex(p=>p.id===pid)));}
  return Object.assign(s,extra||{});
}
function hostBroadcast(){
  const h=H;h.seq++;const s=pubState();
  const now=Date.now();
  if(NET)NET.send({t:'st',seq:h.seq,s,now});
  const prev=S;S=s;S.seq=h.seq;off=0;lastSt=now;
  if(!prev||prev.r!==s.r)mine={};else if(prev.ph!==s.ph)mine={fk:mine.fk};
  if(prev&&s.ph==='rv'&&prev.ph!=='rv'){setTimeout(()=>sfx.round(),900);const k=0;if(s.pt&&s.pt[k]>0)sfx.ok();else sfx.bad();}
  view();startUi();
}
function hostJoin(m){
  const h=H;if(!m.id||!m.name)return;
  let p=h.players.find(x=>x.id===m.id);
  if(p){hostBroadcast();return;}
  if(h.ph!=='lobby'){NET.send({t:'kick',to:m.id,why:'اللعبة بدأت بالفعل في الغرفة دي.'});return;}
  if(h.players.length>=h.cfg.maxP){NET.send({t:'kick',to:m.id,why:'الغرفة مليانة ('+h.cfg.maxP+' لاعبين).'});return;}
  if(h.cfg.appr){if(!h.pending.some(x=>x.id===m.id)){h.pending.push({id:m.id,name:String(m.name).slice(0,14),av:avOK(m.av)});view();}return;}
  let nm=String(m.name).slice(0,14),k=2;while(h.players.some(x=>x.name===nm))nm=String(m.name).slice(0,12)+' '+k++;
  h.players.push({id:m.id,name:nm,av:avOK(m.av),score:0,right:0});
  hostBroadcast();
}
function hostBye(id){const h=H;if(h.ph!=='lobby')return;const i=h.players.findIndex(p=>p.id===id);if(i>0){h.players.splice(i,1);hostBroadcast();}}
function pickItems(cfg){
  let pool=Q.filter(q=>cfg.cats.includes(q[0])&&(cfg.diff===0||q[1]===cfg.diff));
  if(pool.length<cfg.n)pool=Q.filter(q=>cfg.cats.includes(q[0]));
  return shuffle(pool).slice(0,cfg.n).map(q=>({cat:q[0],diff:q[1],text:q[2],right:q[3],wrong:q.slice(4)}));
}
function hostStart(){
  const h=H;if(h.players.length<2||h.cfg.cats.length<6){return;}
  h.items=pickItems(h.cfg);h.r=-1;h.players.forEach(p=>{p.score=0;p.right=0});
  hostNext();
}
function hostNext(){
  const h=H;h.r++;
  if(h.r>=h.items.length){h.ph='fin';h.ends=0;return hostBroadcast();}
  const it=h.items[h.r];h.ans={};h.fakes={};h.votes={};h.picks=null;h.pts=null;h.owners=[];
  if(h.cfg.mode==='classic'){
    h.opts=shuffle([it.right,...it.wrong]);h.right=h.opts.indexOf(it.right);h.ph='q';h.lim=LIM.q;
  }else{h.ph='wr';h.opts=[];h.lim=LIM.wr;}
  h.ends=Date.now()+h.lim*1000;hostBroadcast();
}
function hostAns(id,r,k){
  const h=H;if(h.ph!=='q'||r!==h.r||h.ans[id]||!h.players.some(p=>p.id===id)||!(k>=0&&k<4))return;
  h.ans[id]={k,left:Math.max(0,(h.ends-Date.now())/1000)};
  if(h.players.every(p=>h.ans[p.id]))hostReveal();
}
function hostFake(id,r,x){
  const h=H;if(h.ph!=='wr'||r!==h.r||!h.players.some(p=>p.id===id))return;
  x=String(x||'').trim().slice(0,40);const it=h.items[h.r];
  if(!x||norm(x)===norm(it.right)){NET.send({t:'rj',to:id,r:h.r});if(id===ME.id){mine.rej=true;mine.fk=null;view();}return;}
  h.fakes[id]=x;
  if(h.players.every(p=>h.fakes[p.id]))hostVoteStart();
}
function hostVoteStart(){
  const h=H,it=h.items[h.r];
  const list=[{t:it.right,o:[],real:true}];
  for(const p of h.players){const x=h.fakes[p.id];if(!x)continue;const e=list.find(l=>norm(l.t)===norm(x));if(e)e.o.push(p.id);else list.push({t:x,o:[p.id],real:false});}
  const need=Math.max(0,4-list.length);const houses=shuffle(it.wrong).filter(w=>!list.some(l=>norm(l.t)===norm(w)));
  houses.slice(0,Math.max(need,1)).forEach(w=>list.push({t:w,o:[],real:false}));
  const sh=shuffle(list);h.opts=sh.map(l=>l.t);h.owners=sh.map(l=>l.o);h.right=sh.findIndex(l=>l.real);
  h.ph='vt';h.lim=LIM.vt;h.ends=Date.now()+h.lim*1000;hostBroadcast();
}
function hostVote(id,r,k){
  const h=H;if(h.ph!=='vt'||r!==h.r||h.votes[id]!==undefined||!h.players.some(p=>p.id===id))return;
  if(!(k>=0&&k<h.opts.length)||h.owners[k].includes(id))return;
  h.votes[id]=k;
  if(h.players.every(p=>h.votes[p.id]!==undefined))hostReveal();
}
function hostReveal(){
  const h=H;const n=h.players.length;h.picks=new Array(n).fill(-1);h.pts=new Array(n).fill(0);
  if(h.cfg.mode==='classic'){
    h.players.forEach((p,i)=>{const a=h.ans[p.id];if(!a)return;h.picks[i]=a.k;if(a.k===h.right){h.pts[i]=PTS[(h.items[h.r]||{}).diff]||10;p.right++;}});
  }else{
    h.players.forEach((p,i)=>{const k=h.votes[p.id];if(k===undefined)return;h.picks[i]=k;if(k===h.right){h.pts[i]+=200;p.right++;}else h.owners[k].forEach(pid=>{const j=h.players.findIndex(x=>x.id===pid);if(j>=0)h.pts[j]+=100;});});
  }
  h.players.forEach((p,i)=>p.score+=h.pts[i]);
  h.rscore=null;h.ph='rv';h.lim=LIM.rv+(h.cfg.mode==='bluff'?3:0);h.ends=Date.now()+h.lim*1000;hostBroadcast();
}
function hostTick(){
  const h=H;if(!h)return;const now=Date.now();
  if(h.ph==='q'&&now>=h.ends+800)hostReveal();
  else if(h.ph==='wr'&&now>=h.ends+800){if(Object.keys(h.fakes).length)hostVoteStart();else{h.ph='vt';h.fakes={};hostVoteStart();}}
  else if(h.ph==='vt'&&now>=h.ends+800)hostReveal();
  else if(h.ph==='rv'&&now>=h.ends)hostNext();
}

// ---------- matching ----------
function riddleMatch(input,answers){const n=norm(input);if(!n)return false;return answers.some(a=>{const m=norm(a);return m===n||(n.length>=3&&m.length>=3&&(n.includes(m)||m.includes(n))&&Math.abs(n.length-m.length)<=3)});}

// ---------- question picking ----------
function pickQuestions(n){
  const seen=new Set(store.get('seen',[]));
  const pool=Q.map((q,i)=>({q,i})).filter(({q})=>CFG.cats.includes(q[0])&&(CFG.diff===0||q[1]===CFG.diff));
  let fresh=pool.filter(p=>!seen.has(p.i));
  if(fresh.length<n){ // reset seen for this pool
    const ids=new Set(pool.map(p=>p.i));store.set('seen',[...seen].filter(i=>!ids.has(i)));fresh=pool;
  }
  let picked=shuffle(fresh).slice(0,n);
  if(picked.length<n){const rest=shuffle(Q.map((q,i)=>({q,i})).filter(p=>!picked.some(x=>x.i===p.i)));picked=picked.concat(rest.slice(0,n-picked.length));}
  store.set('seen',[...new Set([...store.get('seen',[]),...picked.map(p=>p.i)])]);
  return picked.map(p=>{const q=p.q;return {cat:q[0],diff:q[1],text:q[2],right:q[3],wrong:q.slice(4)}});
}
function pickRiddles(n){
  const seen=new Set(store.get('rseen',[]));let pool=R.map((r,i)=>({r,i}));
  let fresh=pool.filter(p=>!seen.has(p.i));if(fresh.length<n){fresh=pool;store.set('rseen',[]);}
  const picked=shuffle(fresh).slice(0,Math.min(n,pool.length));
  store.set('rseen',[...new Set([...store.get('rseen',[]),...picked.map(p=>p.i)])]);
  return picked.map(p=>({text:p.r[0],answers:p.r[1],hintRaw:p.r[2]}));
}

function remaining(){const it=G.items[G.i];return Math.max(0,it.limit-(Date.now()-it.t0)/1000);}

function answerClassic(k){
  const it=G.items[G.i];if(it.locked)return;it.locked=true;clearTimer();
  const p=G.players[G.turn];const ok=k>=0&&it.opts[k]===it.right;let msg;
  if(ok){const left=remaining();p.streak++;p.best=Math.max(p.best,p.streak);p.right++;const speed=Math.round(50*left/it.limit);const sb=0;const pts=PTS[it.diff]||10;p.score+=pts;msg=`صح! +${pts} نقطة${sb?` (ستريك ${p.streak} 🔥)`:''}`;sfx.ok();}
  else{p.streak=0;msg=k<0?`الوقت خلص. الإجابة: ${esc(it.right)}`:`غلط. الإجابة الصح: ${esc(it.right)}`;sfx.bad();}
  G.log.push({q:it.text,ok});
  renderClassic({pick:k,ok,msg});
}
function useLife(l){
  const it=G.items[G.i],p=G.players[G.turn];if(it.locked||!p.lifes[l])return;
  if(l==='half'){const wrongIdx=it.opts.map((o,k)=>k).filter(k=>it.opts[k]!==it.right&&!it.removed.includes(k));it.removed=it.removed.concat(shuffle(wrongIdx).slice(0,2));}
  if(l==='time'){it.limit+=10;}
  p.lifes[l]--;
  if(l==='skip'){it.locked=true;clearTimer();G.i++;return next();}
  renderClassic();
}

// ---- riddle ----
function riddleView(res){
  const it=G.items[G.i],p=G.players[G.turn];
  if(!res&&!it.started){it.started=true;it.tries=2;it.hint=false;it.t0=Date.now();it.limit=40;it.done=false;clearTimer();timer=setInterval(()=>{if(it.done){clearTimer();return}updateBar();if(remaining()<=0)giveUp(true)},100);}
  const hintTxt=it.hint?`<div class="hint">💡 ${esc(it.hintText)}</div>`:'';
  shell(`${scoreboard()}<div class="qmeta"><span>🧩 لغز</span><span>محاولات: ${it.tries||0}</span><span>${G.i+1}/${G.n}</span></div><div class="bar"><i id="bar"></i></div>
  ${qbox(it.text)}${it.hint?hintTxt:''}
  ${res?`<div class="res ${res.ok?'good':'bad'}">${res.msg}</div><button class="btn big" data-act="nextq">${G.i+1>=G.n?'النتيجة':'اللغز الجاي'}</button>`:`<div class="ans"><input id="rans" placeholder="اكتب إجابتك" autocomplete="off" aria-label="الإجابة"><button class="btn" data-act="rsend">إجابة</button></div><div class="row"><button class="btn sm ghost" data-act="rhint" ${it.hint?'disabled':''}>💡 تلميح (−50%)</button><button class="btn sm ghost" data-act="rgive">أستسلم</button></div><div id="msg" class="warn"></div>`}`);
  updateBar();const inp=$('#rans');if(inp)inp.focus();
}
function riddleSubmit(){
  const it=G.items[G.i],p=G.players[G.turn];if(it.done)return;
  const v=$('#rans').value;if(!v.trim())return;
  if(riddleMatch(v,it.answers)){
    it.done=true;clearTimer();const pts=it.hint?5:10;p.score+=pts;p.right++;p.streak++;p.best=Math.max(p.best,p.streak);sfx.ok();G.log.push({q:it.text,ok:true});
    riddleView({ok:true,msg:`برافو! الإجابة: ${esc(it.answers[0])} (+${pts})`});
  }else{it.tries--;sfx.bad();if(it.tries<=0)return giveUp(false);riddleView();$('#msg').textContent='لأ مش دي. جرّب تاني.';}
}
function giveUp(timeout){
  const it=G.items[G.i],p=G.players[G.turn];if(it.done)return;it.done=true;clearTimer();p.streak=0;G.log.push({q:it.text,ok:false});
  riddleView({ok:false,msg:`${timeout?'الوقت خلص. ':''}الإجابة كانت: ${esc(it.answers[0])}`});
}

// ---- bluff ----
function bluffRound(){
  if(G.i>=G.n)return finish();
  const it=G.items[G.i];it.fakes=[];it.votes=[];it.who=0;
  bluffPass();
}
function bluffPass(){
  const it=G.items[G.i],p=G.players[it.who];
  shell(`<div class="panel center"><div class="big-emoji">🤫</div><h2>${esc(p.name)}</h2><p>جولة ${G.i+1}/${G.n}. ادّي الموبايل لـ ${esc(p.name)} من غير ما حد يبص.</p><button class="btn big" data-act="bwrite">جاهز</button></div>${scoreboard()}`);
}
function bluffWrite(msg){
  const it=G.items[G.i],p=G.players[it.who];
  shell(`${scoreboard()}<div class="qmeta"><span>${CATS[it.cat]}</span><span>جولة ${G.i+1}/${G.n}</span></div>${qbox(it.text)}<p class="center">اكتب إجابة مزيفة تخلّي غيرك يصدّقها، يا ${esc(p.name)}</p>
  <div class="ans"><input id="fake" maxlength="40" placeholder="إجابتك المزيفة" autocomplete="off" aria-label="إجابة مزيفة"><button class="btn" data-act="bsend">تمام</button></div><div id="msg" class="warn">${msg||''}</div>`);
  $('#fake').focus();
}
function bluffSend(){
  const it=G.items[G.i],v=$('#fake').value.trim();if(!v)return;
  if(norm(v)===norm(it.right))return bluffWrite('😅 دي الإجابة الصح فعلًا! اكتب حاجة تانية.');
  if(it.fakes.some(f=>norm(f.text)===norm(v)))return bluffWrite('حد كتب نفس الإجابة دي. غيّرها شوية.');
  it.fakes.push({text:v,by:it.who});it.who++;
  if(it.who>=G.players.length){it.who=0;it.options=shuffle([{text:it.right,by:-1},...it.fakes,...shuffle(it.wrong).slice(0,2).map(t=>({text:t,by:-2}))]);return bluffVotePass();}
  bluffPass();
}
function bluffVotePass(){
  const it=G.items[G.i],p=G.players[it.who];
  shell(`<div class="panel center"><div class="big-emoji">🗳️</div><h2>التصويت: ${esc(p.name)}</h2><p>اختار الإجابة اللي شايفها صح.</p><button class="btn big" data-act="bvote">جاهز</button></div>${scoreboard()}`);
}
function bluffVote(){
  const it=G.items[G.i],p=G.players[it.who];
  shell(`${scoreboard()}${qbox(it.text)}<p class="center">${esc(p.name)}، أي إجابة هي الصح؟ (إجابتك المزيفة متقفلة)</p><div class="opts">${it.options.map((o,k)=>`<button class="opt" data-bv="${k}" ${o.by===it.who?'disabled':''}>${esc(o.text)}</button>`).join('')}</div>`);
}
function bluffPick(k){
  const it=G.items[G.i];it.votes.push({voter:it.who,opt:k});it.who++;
  if(it.who>=G.players.length)return bluffReveal();
  bluffVotePass();
}
function bluffReveal(){
  const it=G.items[G.i];const gains=G.players.map(()=>0);
  it.votes.forEach(v=>{const o=it.options[v.opt];if(o.by===-1){gains[v.voter]+=2;G.players[v.voter].right++;}else if(o.by>=0){gains[o.by]+=1;}});
  G.players.forEach((p,i)=>p.score+=gains[i]);
  const rows=it.options.map((o,k)=>{const voters=it.votes.filter(v=>v.opt===k).map(v=>esc(G.players[v.voter].name));const author=o.by===-1?'✅ الإجابة الصح':o.by===-2?'🏠 إجابة البيت':'✍️ '+esc(G.players[o.by].name);return `<div class="opt ${o.by===-1?'right':''}" style="cursor:default"><b>${esc(o.text)}</b><small>${author}${voters.length?' | اختارها: '+voters.join('، '):''}</small></div>`}).join('');
  shell(`${scoreboard()}${qbox(it.text)}<div class="opts">${rows}</div><div class="res good">${G.players.map((p,i)=>`${esc(p.name)} +${gains[i]}`).join(' • ')}</div><button class="btn big" data-act="bnext">${G.i+1>=G.n?'النتيجة':'الجولة الجاية'}</button>`);
  sfx.ok();
}

// ---- results ----
function finish(){
  clearTimer();
  const sorted=G.players.map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score);
  const top=sorted[0];const tie=sorted.length>1&&sorted[1].score===top.score;
  const maxPts=G.mode==='bluff'?'':'';
  sfx.win();shell(`<div class="panel center"><div class="big-emoji">${tie?'🤝':'🏆'}</div><h2>${tie?'تعادل!':'الفائز: '+esc(top.name)}</h2>
  <div class="rank">${sorted.map((p,k)=>`<div class="rk"><span class="who">${k+1}. ${avh(store.get('myav',''))}${esc(p.name)}</span><span>${p.score} نقطة • ${p.right} صح${G.mode==='classic'?` • أطول ستريك ${p.best}`:''}</span></div>`).join('')}</div>
  <button class="btn big" data-act="again">العب تاني</button><button class="btn ghost" data-act="home">القائمة</button></div>`);
  window.__last={mode:G.mode,scores:G.players.map(p=>p.score)};setTimeout(()=>window.burst&&window.burst(40),250);
}

// ---------- navigation history ----------
let VH=[],CURV=null,NAVING=false;
function goBack(){const p=VH.pop();if(!p)return home();NAVING=true;try{p.f();}finally{NAVING=false;}}
function trk(n,fn,reset){return function(...a){if(reset){VH=[];CURV=null;}else if(!NAVING){if(CURV&&CURV.n!==n){VH.push(CURV);try{history.pushState({v:1},'')}catch(e){}}}CURV={n,f:()=>fn.apply(null,a)};return fn.apply(this,a);}}
home=trk('home',home,true);setup=trk('setup',setup);catsBrowser=trk('cats',catsBrowser);profileView=trk('me',profileView);installView=trk('inst',installView);howto=trk('how',howto);
try{const _o=ONL.open;ONL.open=trk('onl',_o);}catch(e){}
window.addEventListener('popstate',()=>{if(VH.length)goBack();});

// ---------- events ----------
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(!t.dataset.pick&&!t.dataset.bv&&!t.dataset.o)sfx.tap();
  if(t.dataset.pf)return pfClick(t);
  if(t.dataset.tab){const k=t.dataset.tab;if(k==='home')return home();if(k==='cats')return catsBrowser({get:()=>CFG.cats,set:c=>{CFG.cats=c;store.set('cats',c);catsView();},onDone:()=>home(),tab:'cats'});if(k==='online')return ONL.open();if(k==='me')return profileView();return;}
  if(t.dataset.catf!==undefined){catF=t.dataset.catf;return catsView();}
  if(t.dataset.catt){const c=t.dataset.catt,sel=catBr.get();const i=sel.indexOf(c);if(i>=0){sel.splice(i,1);}else sel.push(c);catBr.set(sel);return catsView();}
  if(t.dataset.mode)return setup(t.dataset.mode);
  if(t.dataset.cat){const c=t.dataset.cat;const i=CFG.cats.indexOf(c);if(i>=0){if(CFG.cats.length>1)CFG.cats.splice(i,1);}else CFG.cats.push(c);return setup(CFG.mode);}
  if(t.dataset.diff!==undefined){CFG.diff=+t.dataset.diff;return setup(CFG.mode);}
  if(t.dataset.rounds){CFG.rounds=+t.dataset.rounds;return setup(CFG.mode);}
  if(t.dataset.pick!==undefined)return answerClassic(+t.dataset.pick);
  if(t.dataset.life)return useLife(t.dataset.life);
  if(t.dataset.bv!==undefined)return bluffPick(+t.dataset.bv);
  switch(t.dataset.act){
    case 'online':return ONL.open();
    case 'me':return profileView();
    case 'install':return installView();
    case 'catsall2':{const sel=catBr.get();const all=Object.keys(CATS);const on=sel.length>=all.length;sel.length=0;if(!on)all.forEach(k=>sel.push(k));catBr.set(sel);return catsView();}
    case 'catsall':CFG.cats=Object.keys(CATS);return setup(CFG.mode);
    case 'catsnone':CFG.cats=[];return setup(CFG.mode);
    case 'catsedit':return catsBrowser({get:()=>CFG.cats,set:c=>{CFG.cats=c;store.set('cats',c);},onDone:()=>setup(CFG.mode)});
    case 'catsdone':{const o=catBr;catBr=null;if(o&&o.onDone)return o.onDone();return home();}
    case 'rminus':case 'rplus':{const st=RSTEP[CFG.mode];let i=st.indexOf(CFG.rounds);i+=t.dataset.act==='rplus'?1:-1;i=Math.max(0,Math.min(st.length-1,i));CFG.rounds=st[i];return setup(CFG.mode);}
    case 'back':return goBack();case 'home':return home();case 'howto':return howto();
    case 'sound':store.set('sound',!store.get('sound',true));if(TAB==='me')return profileView();t.textContent=store.get('sound',true)?'🔊':'🔇';return;
    case 'padd':CFG.players.push('لاعب '+(CFG.players.length+1));return setup(CFG.mode);
    case 'pdel':CFG.players.pop();return setup(CFG.mode);
    case 'start':return startGame();
    case 'again':return startGame();
    case 'ready':return ready();
    case 'nextq':G.i++;return next();
    case 'rsend':return riddleSubmit();
    case 'rgive':return giveUp(false);
    case 'rhint':{const it=G.items[G.i];it.hint=true;it.hintText=it.hintRaw;return riddleView();}
    case 'bwrite':return bluffWrite();
    case 'bsend':return bluffSend();
    case 'bvote':return bluffVote();
    case 'bnext':G.i++;return bluffRound();
  }
});
document.addEventListener('input',e=>{
  if(e.target.classList.contains('pn'))CFG.players[+e.target.dataset.i]=e.target.value;
  if(e.target.id==='catq'){catQ=e.target.value;catsView();const el=document.getElementById('catq');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}}
  if(e.target.id==='rng'){CFG.rounds=+e.target.value;const r=document.getElementById('rv');if(r)r.textContent=CFG.rounds;}
  if(e.target.id==='orng'){const r=document.getElementById('orv');if(r)r.textContent=e.target.value;}
  if(e.target.id==='pfname'&&PF){PF.name=e.target.value.trim().slice(0,14);const b=document.getElementById('pfsave');if(b)b.disabled=!pfValid();}
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='rans')riddleSubmit();if(e.target.id==='fake')bluffSend();});

const ONL=initOnline({app,esc,shuffle,norm,Q,CATS,shell,sfx,home,store,catsBrowser,avh,avOK,setTab:k=>{TAB=k}});
window.__ONL=ONL;window.__lgHome=home;
profileOk()?home():profileForm(true);
}

;boot();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});}
</script>
